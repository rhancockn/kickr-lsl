[project]
name = "wahoo-lsl"
version = "0.1.0"
description = "Stream CPS data from and control (FTMS) a Wahoo KICKR over BLE"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bleak>=1.0",
    "pylsl>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
windows = ["pyinstaller>=6"]

[project.scripts]
wahoo-lsl = "wahoo_lsl.cli:main"
wahoo-ftms = "wahoo_lsl.ftms.cli:main"
wahoo-dashboard = "wahoo_lsl.dashboard.launcher:main"
wahoo-server = "wahoo_lsl.apps.server_app:main"
wahoo-dashboard-app = "wahoo_lsl.apps.dashboard_app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
